server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Never cache the calculator so updates are picked up instantly
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ =404;
        expires 7d;
    }
}
